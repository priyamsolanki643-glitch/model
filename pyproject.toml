[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qreason"
version = "0.1.0"
description = "Model-agnostic complex latent reasoning research adapter"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["qreason*"]
